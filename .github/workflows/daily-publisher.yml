name: Daily Content Publisher

on:
  schedule:
    # Runs at 00:00 UTC on Sunday (0), Tuesday (2), and Friday (5)
    - cron: '0 0 * * 0,2,5'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Publisher Script
        run: |
          python scripts/publisher.py